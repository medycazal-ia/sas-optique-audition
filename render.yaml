# Blueprint Render pour une VERSION DÉMO uniquement.
#
# Important — voir docs/conformite-hds.md : l'hébergement Render standard
# n'est PAS certifié HDS. Ce blueprint convient pour montrer l'application
# avec des données fictives, pas pour y saisir de vraies données de client.
#
# Déploiement : docs/deploiement-render.md

services:
  - type: web
    name: sas-optique-audition
    runtime: node
    plan: starter
    # --include=dev : NODE_ENV=production (ci-dessous) fait sinon ignorer
    # devDependencies dès `npm install`, alors que le build (`next build`)
    # a besoin d'outils qui y sont déclarés (Tailwind/PostCSS, TypeScript…).
    # Sans ce flag, on retombe régulièrement sur "Cannot find module" au
    # build pour tel ou tel paquet dev — mieux vaut les installer tous.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx next start -p $PORT
    # Disque persistant pour les documents scannés (src/lib/stockageFichiers.ts).
    # Sans lui, le disque du service est éphémère : chaque redéploiement (un
    # simple `git push` mergé) efface les fichiers déjà téléversés, alors que
    # leur ligne Document reste en base (PostgreSQL, lui, persistant) — d'où
    # une erreur "ENOENT: no such file or directory" en rouvrant un document
    # téléversé avant le dernier déploiement. Toujours pas une solution de
    # production HDS (voir docs/conformite-hds.md — il faudra un stockage
    # S3-compatible chez l'hébergeur certifié retenu), mais suffisant pour
    # qu'une démo/un test ne perde plus ses fichiers à chaque mise à jour.
    disk:
      name: documents
      mountPath: /var/data/stockage-documents
      sizeGB: 1
    envVars:
      - key: STOCKAGE_LOCAL_DOSSIER
        value: /var/data/stockage-documents
      - key: DATABASE_URL
        fromDatabase:
          name: sas-optique-audition-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Carte Super Admin (src/app/super-admin) — liste d'emails séparés par
      # des virgules reconnus super admin, indépendamment de tout rôle en
      # base. `sync: false` : jamais stocké dans ce fichier ni dans git,
      # réglable uniquement à la main depuis le tableau de bord Render par
      # le fondateur — voir prisma/schema.prisma (enum RoleUtilisateur) pour
      # le second mécanisme (rôle SUPER_ADMIN attribué à la main en base).
      - key: SUPER_ADMIN_EMAILS
        sync: false
      # Extraction OCR de l'ordonnance (carte Fiche) par IA de vision —
      # clé personnelle à créer sur console.anthropic.com, jamais stockée
      # dans ce fichier ni dans git. Sans cette clé, le bouton "Extraire de
      # l'ordonnance" échoue proprement (message d'erreur clair) — le reste
      # de l'application fonctionne normalement.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Envoi automatique par email des demandes de prise en charge (carte
      # Mutuelle & tiers payant) — clé personnelle à créer sur resend.com,
      # jamais stockée dans ce fichier ni dans git. Sans cette clé, le
      # bouton "Envoyer par email" échoue proprement (message d'erreur
      # clair) — l'envoi manuel ("Marquer envoyée") reste disponible.
      - key: RESEND_API_KEY
        sync: false
      # Adresse d'expédition des emails ci-dessus — doit appartenir à un
      # domaine vérifié sur resend.com pour pouvoir écrire à un tiers (la
      # valeur par défaut de test de Resend ne peut écrire qu'au compte
      # Resend lui-même). Optionnel : sans cette variable, l'envoi utilise
      # cette valeur de test, donc n'atteint pas réellement les mutuelles.
      - key: RESEND_FROM
        sync: false
      # Recherche automatique des accords/refus de prise en charge reçus
      # par mail (carte Mutuelle & tiers payant, Super Admin > Boîtes mail
      # tiers payant) — voir lib/traitementMailAccordMutuelle.ts. Ce
      # logiciel ne se connecte à aucune boîte mail lui-même : un scénario
      # Make (make.com) surveille la/les boîte(s) et POSTe chaque mail
      # pertinent à /api/automatisations/accord-mutuelle-entrant.
      # ACCORD_MUTUELLE_WEBHOOK_SECRET : jeton partagé arbitraire (à générer
      # soi-même) — le même doit être collé dans l'en-tête Authorization du
      # scénario Make. Sans lui, ce webhook répond 503 (rien d'autre n'est
      # affecté).
      - key: ACCORD_MUTUELLE_WEBHOOK_SECRET
        sync: false
      # MAKE_API_TOKEN : jeton d'API personnel (Make > profil > API), pour
      # que le bouton "Relancer la recherche" (affiché sur un refus) puisse
      # déclencher une exécution immédiate du scénario Make plutôt que
      # d'attendre son prochain passage planifié. Sans lui, ce bouton
      # échoue proprement (message d'erreur clair) — la recherche
      # automatique quotidienne continue de fonctionner normalement.
      - key: MAKE_API_TOKEN
        sync: false
      # Zone Make du compte (visible dans l'URL, ex. eu1.make.com,
      # eu2.make.com, us1.make.com...) — par défaut eu1.make.com.
      - key: MAKE_ZONE
        sync: false
      # Signature électronique du consentement RGPD par code SMS (carte
      # RGPD) — compte et clés à créer sur twilio.com, jamais stockés dans
      # ce fichier ni dans git. TWILIO_FROM est le numéro Twilio expéditeur
      # (au format international, ex. +33756XXXXXX). Sans ces trois
      # variables, l'envoi du code échoue proprement (message clair) — la
      # validation à l'écran, la signature au stylet et le formulaire papier
      # restent disponibles.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Page publique /rdv-demo (bouton "RDV DEMO"/QR code de la page
      # d'accueil) — prise de rendez-vous "maison" au-dessus de l'API Google
      # Calendar (voir lib/googleCalendarRdv.ts ; Google ne permet de créer
      # un agenda ou un "Programme de rendez-vous" que depuis son interface
      # web, jamais par API). Identifiants OAuth2 propres à l'exploitant,
      # jamais stockés dans ce fichier ni dans git — à créer sur
      # console.cloud.google.com :
      #   1. Nouveau projet (ou existant) > APIs & Services > activer
      #      "Google Calendar API".
      #   2. APIs & Services > Écran de consentement OAuth > type "Externe",
      #      renseigner le nom de l'appli (FACILOG) — pas besoin de
      #      validation Google pour un usage personnel en mode "Test".
      #   3. Identifiants > Créer des identifiants > ID client OAuth > type
      #      "Application Web" > Origines JavaScript autorisées :
      #      https://sas-optique-audition.onrender.com > URI de
      #      redirection autorisés :
      #      https://sas-optique-audition.onrender.com/api/super-admin/rdv-demo/callback
      #   4. Coller ici l'ID client et le code secret obtenus.
      # Une fois ces deux variables renseignées, connectez l'agenda depuis
      # Super Admin > Prise de RDV (bouton "Connecter Google Calendar") —
      # étape qui ne peut se faire que depuis l'écran Google lui-même (un
      # consentement ne peut pas être donné par API). Sans ces variables, la
      # page /rdv-demo reste utilisable : elle affiche un message clair
      # invitant à contacter directement plutôt qu'un sélecteur vide.
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false

databases:
  - name: sas-optique-audition-db
    # "starter" (legacy) n'est plus proposé pour les nouvelles bases Render.
    # "free" convient pour une démo mais Render supprime les bases gratuites
    # après ~30 jours d'inactivité/âge — passer à "basic-256mb" (payant, non
    # expirant) si la démo doit durer plus longtemps.
    plan: free
    databaseName: sas_optique_audition
    user: sasapp
